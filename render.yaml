# Preparation only. Registration, creation and first deployment require approval.
# One free API; no database, disk, secrets, keepalive or paid resource.
services:
  - type: web
    name: record-official-api
    runtime: python
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: pip install -r server/requirements-free.txt
    startCommand: gunicorn 'server.public:create_public_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 75 --max-requests 0 --no-control-socket
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
