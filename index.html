<script>
const $=id=>document.getElementById(id), status=$('status'),results=$('results');
let relatedCatalogAlbums=[],artistChoices=[],ytVisible=20,ytSort='name',ytAlbums=[],albums=[],filter='おすすめ',artistName='',offset=0,artistId='',busy=false,total=0;
const aliases={'マイルスデイビス':'Miles Davis','マイルスデイヴィス':'Miles Davis','デュークエリントン':'Duke Ellington','ジェフベック':'Jeff Beck','ジミヘンドリックス':'Jimi Hendrix','ジミヘン':'Jimi Hendrix','ジャニス':'Janis Joplin','ジャニスジョプリン':'Janis Joplin','スタンゲッツ':'Stan Getz','ジョンコルトレーン':'John Coltrane','チックコリア':'Chick Corea','ビートルズ':'The Beatles','原田知世':'Tomoyo Harada'};
const normalize=s=>s.toLowerCase().replace(/[\s・･ー‐－]/g,'');

const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));let lastRequestAt=0;let requestQueue=Promise.resolve();function api(path){const job=requestQueue.catch(()=>{}).then(async()=>{let url='https://musicbrainz.org/ws/2/'+path;for(let attempt=0;attempt<3;attempt++){let wait=Math.max(0,1100-(Date.now()-lastRequestAt));if(wait)await pause(wait);lastRequestAt=Date.now();try{let r=await fetch(url,{headers:{Accept:'application/json'}});if(r.ok)return await r.json();if(![429,502,503,504].includes(r.status)||attempt===2)throw Error('音楽データを取得できませんでした（'+r.status+'）');}catch(e){if(attempt===2||!/Failed to fetch|NetworkError|Load failed/i.test(e.message))throw e}await pause((attempt+1)*1700)}throw Error('通信が混み合っています')});requestQueue=job.catch(()=>{});return job}
function automaticState(a){
 const e=a.automatic_verification;
 if(!e||e.version!==1||e.album_id!==a.id)return 'insufficient';

 if(!Number.isFinite(age)||age<0||age>30*24*60*60*1000)return 'insufficient';

 line('メタデータの照合結果です。正規配信の権利許諾を保証するものではありません。不一致は取得した候補との比較であり、非正規盤との断定ではありません。');
 if(!e||e.album_id!==a.id){line('自動照合は未実施です。手入力なしで確認できる根拠がまだありません。');info.append(panel);return}
 line('確認日時：'+(e.checked_at||'不明')+(automaticState(a)==='insufficient'&&e.status!=='insufficient'?'（再確認が必要）':''));
 for(const text of e.limitations||[])line(text);
 const yt=e.youtube;
 if(yt){
  line('YouTube Music レーベル：'+((yt.labels||[]).join(' / ')||'未取得')+' · 発売元：'+(yt.publisher||'未取得'));

 }
 const terms={official:'公式発売登録',title:'作品名',artist:'アーティスト',label:'レーベル',count:'曲数',titles:'曲名',order:'曲順'},values={match:'一致',different:'不一致',unknown:'情報不足'};
 for(const c of e.candidates||[]){

function titleKey(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/\([^)]*(remaster|mono|stereo|edition)[^)]*\)/gi,'').replace(/[^\p{L}\p{N}]/gu,'')}
function uniqueAlbums(){let map=new Map();for(const a of albums){const key=titleKey(a.title)+'|'+typeOf(a);if(!map.has(key))map.set(key,a);else{const old=map.get(key);if((a['first-release-date']||'9999')<(old['first-release-date']||'9999'))map.set(key,a)}}return [...map.values()].sort((a,b)=>(a['first-release-date']||'9999').localeCompare(b['first-release-date']||'9999'))}
const releaseEvidenceCache=(()=>{try{return JSON.parse(localStorage.getItem('recordReleaseEvidenceV1')||'{}')}catch{return {}}})();
function usableLabel(name){return typeof name==='string'&&name.trim()&&!['[no label]','[unknown]'].includes(name.trim().toLowerCase())}
function cachedOfficialEvidence(id){
  const record=releaseEvidenceCache[id];
  if(!record||Date.now()-record.savedAt>=30*24*60*60*1000)return null;
  const releases=record.data?.releases||[];
  return releases.some(r=>(r.status||'').toLowerCase()==='official'&&(r['label-info']||[]).some(li=>usableLabel(li.label?.name)))?'official':'unconfirmed';
}
function saveReleaseEvidence(id,record){releaseEvidenceCache[id]=record;try{localStorage.setItem('recordReleaseEvidenceV1',JSON.stringify(releaseEvidenceCache))}catch(e){console.warn('Release evidence cache full',e)}}
async function showReleaseDetail(a,container,btn){
  btn.disabled=true;btn.textContent='発売元を確認中…';
  try{
    let cached=releaseEvidenceCache[a.id];
    let d=cached&&Date.now()-cached.savedAt<30*24*60*60*1000?cached.data:null;
    if(!d){
      d=await api('release?release-group='+encodeURIComponent(a.id)+'&inc=labels&limit=100&fmt=json');
      saveReleaseEvidence(a.id,{savedAt:Date.now(),data:d});
    }
    let releases=(d.releases||[]).map(r=>({
      id:r.id||'',date:r.date||'',country:r.country||'',status:r.status||'',catalogNumbers:(r['label-info']||[]).map(li=>li['catalog-number']).filter(Boolean),
      labels:[...new Set((r['label-info']||[]).map(li=>li.label?.name).filter(usableLabel))]
    })).filter(r=>r.labels.length);
    releases.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
    container.textContent='';

    evidence.style.fontWeight='600';
    evidence.textContent=official.length?'MusicBrainzに公式発売登録あり':'発売情報未確認';

    details.className='album-tools';

      let p=document.createElement('div');p.textContent='この取得範囲ではレーベルの登録が見つかりませんでした。';body.append(p);

      for(const release of releases.slice(0,4)){
        let p=document.createElement('div');p.style.marginTop='7px';

const verifiedLinks=(()=>{try{return JSON.parse(localStorage.getItem('recordVerifiedLinks')||'{}')}catch{return {}}})();
function importVerificationRecords(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(data?.format!=='RECORD-verification-v1'||!data.records||typeof data.records!=='object'||Array.isArray(data.records))throw Error('RECORDの照合記録ではありません');
   const valid=Object.entries(data.records).filter(([id,v])=>/^[0-9a-f-]{36}(?:\|https:\/\/music\.youtube\.com\/.*)?$/i.test(id)&&v&&typeof v==='object'&&!Array.isArray(v)&&['pending','matched','different'].includes(v.verdict)&&/^[0-9a-f-]{36}$/i.test(v.mbReleaseGroup||id.split('|')[0]));
   if(!valid.length)throw Error('復元可能な照合記録がありません');
   const merged={...verificationRecords};
   for(const [id,v] of valid){
    const group=v.mbReleaseGroup||id.split('|')[0];
    const url=albumUrl(v.ytUrl||'')?canonicalAlbumUrl(v.ytUrl):'';
    if(!url)continue;
    const key=verificationKey(group,url);
    if(!merged[key]||String(v.checkedAt||'')>String(merged[key].checkedAt||'')){
     merged[key]={verdict:v.verdict,ytLabel:String(v.ytLabel||'').slice(0,300),notes:String(v.notes||'').slice(0,1000),ytUrl:url,mbReleaseGroup:group,checkedAt:String(v.checkedAt||''),...(v.evidenceSnapshot&&typeof v.evidenceSnapshot==='object'&&!Array.isArray(v.evidenceSnapshot)?{evidenceSnapshot:v.evidenceSnapshot}:{})};
    }
   }
   if(!saveLocal('recordVerificationV1',merged))throw Error('ブラウザに保存できませんでした');
   Object.assign(verificationRecords,merged);render();
   alert(valid.length+'件の照合記録を読み込みました。新しい記録を優先して統合しました。');
  }catch(e){alert('読み込みに失敗しました：'+e.message)}
 };
 reader.readAsText(file);
}
function exportVerificationRecords(){
 const payload={format:'RECORD-verification-v1',exportedAt:new Date().toISOString(),records:verificationRecords};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='record-verifications.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);

const verificationRecords=(()=>{try{return JSON.parse(localStorage.getItem('recordVerificationV1')||'{}')}catch{return {}}})();
function canonicalAlbumUrl(url){try{const u=new URL(url);if(u.hostname!=='music.youtube.com'||u.protocol!=='https:')return url;if(u.pathname==='/playlist')return 'https://music.youtube.com/playlist?list='+encodeURIComponent(u.searchParams.get('list')||'');if(u.pathname.startsWith('/browse/'))return 'https://music.youtube.com'+u.pathname;return url}catch{return url}}
function verificationKey(id,url){return id+'|'+canonicalAlbumUrl(url)}
function getVerification(id,url){
 const key=verificationKey(id,url);
 if(verificationRecords[key])return verificationRecords[key];
 const normalized=canonicalAlbumUrl(url);
 return Object.values(verificationRecords).find(v=>v&&v.mbReleaseGroup===id&&canonicalAlbumUrl(v.ytUrl)===normalized)||null;
}
function saveVerification(id,entry){
 if(!albumUrl(entry.ytUrl)||!['pending','matched','different'].includes(entry.verdict))return false;
 // A manual confirmation must include the observed publisher and its rationale.
 if(entry.verdict==='matched'&&(!usableLabel(entry.ytLabel)||!entry.notes?.trim()))return false;
 const previous=getVerification(id,entry.ytUrl);
 const cached=releaseEvidenceCache[id];
 const releases=(cached?.data?.releases||[]).map(r=>({id:r.id,status:r.status,date:r.date,country:r.country,
   labels:(r['label-info']||[]).map(li=>({name:li.label?.name,catalogNumber:li['catalog-number']}))}));
 entry={...entry,mbReleaseGroup:id,ytUrl:canonicalAlbumUrl(entry.ytUrl),evidenceSnapshot:!cached&&previous?.evidenceSnapshot?previous.evidenceSnapshot:{source:'MusicBrainz',
   sourceUrl:'https://musicbrainz.org/release-group/'+encodeURIComponent(id),
   retrievedAt:cached?.savedAt||null,releaseCount:cached?.data?.['release-count']??releases.length,truncated:(cached?.data?.['release-count']||0)>releases.length,releases}};
 const key=verificationKey(id,entry.ytUrl);
 const previousAtKey=verificationRecords[key];
 verificationRecords[key]={...entry,checkedAt:new Date().toISOString()};
 if(!saveLocal('recordVerificationV1',verificationRecords)){if(previousAtKey)verificationRecords[key]=previousAtKey;else delete verificationRecords[key];return false}

}
const albumStatuses=(()=>{try{return JSON.parse(localStorage.getItem('recordAlbumStatuses')||'{}')}catch{return {}}})();
function albumUrl(s){try{let u=new URL(s);if(u.protocol!=='https:'||u.hostname!=='music.youtube.com'||u.username||u.password||u.port)return false;if(u.pathname.startsWith('/browse/'))return /^\/browse\/MPREb_[A-Za-z0-9_-]+$/.test(u.pathname);if(u.pathname==='/playlist')return /^OLAK5uy_[A-Za-z0-9_-]+$/.test(u.searchParams.get('list')||'');return false}catch{return false}}
function saveLocal(key,data){try{localStorage.setItem(key,JSON.stringify(data));return true}catch{return false}}
function setStatus(id,value){albumStatuses[id]=value;return saveLocal('recordAlbumStatuses',albumStatuses)}
async function findCatalogLink(a,output,button,link){button.disabled=true;button.textContent='公式データを照合中…';try{let d=await api('release-group/'+encodeURIComponent(a.id)+'?inc=url-rels&fmt=json');let urls=(d.relations||[]).map(x=>x.url?.resource).filter(Boolean);let matches=urls.filter(albumUrl);if(matches.length){output.textContent='MusicBrainzに登録されたアルバムリンクを発見しました。リンク先の作品・配信元をご確認ください。';link.href=matches[0];link.textContent='登録済みアルバムを直接開く ↗';button.textContent='リンクを発見';}else{output.textContent='この作品にはYouTube MusicのアルバムURLが登録されていません。検索からお探しください。';button.textContent='登録リンクなし'} }catch(e){output.textContent='照合できませんでした。時間をおいてお試しください。';button.disabled=false;button.textContent='もう一度照合'}}
function statusLabel(a){let s=albumStatuses[a.id];return s==='confirmed'?'配信確認済み（ご自身で確認）':s==='missing'?'配信が見つからない（ご自身で確認）':'配信未確認'}
let ytEvidenceOnly=false;
let batchEvidenceBusy=false;
let batchEvidenceStop=false;
async function checkAlbumEvidenceBatch(items,button,progress){
  if(batchEvidenceBusy)return;
  batchEvidenceBusy=true;batchEvidenceStop=false;button.disabled=true;
  const targets=items.filter(x=>x.mb&&cachedOfficialEvidence(x.mb.id)===null).slice(0,10);
  let done=0,failed=0;
  try{
    for(const target of targets){
      if(batchEvidenceStop)break;
      progress.textContent='発売情報を確認中… '+done+'/'+targets.length+'作品';
      try{
        const data=await api('release?release-group='+encodeURIComponent(target.mb.id)+'&inc=labels&limit=100&fmt=json');
        saveReleaseEvidence(target.mb.id,{savedAt:Date.now(),data});
      }catch(error){failed++;console.warn('Batch release lookup failed',target.mb.id,error)}
      done++;
    }
  }finally{
    batchEvidenceBusy=false;
    render();
    let message=document.createElement('p');message.className='sub';
    message.textContent=done+'作品を確認しました'+(failed?'（'+failed+'作品の取得に失敗）':'')+'。残りの作品は再度ボタンから確認できます。';
    const target=document.querySelector('#batch-evidence-message');
    if(target){target.replaceChildren(message)}
  }
}

 try{
  const d=await api('release?artist='+encodeURIComponent(selected)+'&inc=labels+release-groups&limit=100&offset='+officialOffset+'&fmt=json');

 const line=text=>{const p=document.createElement('p');p.className='release-detail';p.textContent=text;section.append(p)};
 line('発売記録を'+officialOffset+' / '+officialTotal+'件取得。取得済みの範囲を表示しています。再発・国別盤は発売盤ごとに表示します。');
 if(officialError)line('発売記録を取得できませんでした：'+officialError+'。取得済みの記録は保持しています。');
 const visible=officialReleases.filter(r=>releaseVisibility(r)!=='excluded'&&r['release-group']?.['primary-type']==='Album');
 visible.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||a.title.localeCompare(b.title));
 for(const r of visible){
  const article=document.createElement('article');article.className='album';const info=document.createElement('div');info.className='info';
  const title=document.createElement('div');title.className='album-title';title.textContent=r.title;
  const meta=document.createElement('div');meta.className='meta';
  const labels=(r['label-info']||[]).map(li=>li.label?.name).filter(usableLabel),numbers=(r['label-info']||[]).map(li=>li['catalog-number']).filter(Boolean);
  meta.textContent=[r.date||'発売日未登録',typeOf(r['release-group']||{}),r.country,labels.join(' / ')||'レーベル未登録',numbers.length?'品番：'+numbers.join(' / '):'',releaseVisibility(r)==='official'?'公式発売の登録あり':'発売区分未登録（確認待ち）'].filter(Boolean).join(' · ');
  const search=document.createElement('a');search.className='listen';search.target='_blank';search.rel='noopener noreferrer';search.href='https://music.youtube.com/search?q='+encodeURIComponent(artistName+' '+r.title);search.textContent='YouTube Musicで探す ↗';
  const source=document.createElement('a');source.className='listen';source.target='_blank';source.rel='noopener noreferrer';source.href='https://musicbrainz.org/release/'+encodeURIComponent(r.id);source.textContent='発売記録を見る ↗';source.style.marginLeft='14px';
  const details=document.createElement('details'),caption=document.createElement('summary');details.className='album-tools';caption.textContent='収録曲・曲順を見る';details.append(caption);
  const button=document.createElement('button');button.className='detail-btn';button.textContent='曲目を取得';button.onclick=()=>showEditionTracks(r,details,button);details.append(button);
  info.append(title,meta,search,source,details);
  const group=r['release-group']?.id,saved=verifiedLinks[group];
  if(group&&albumStatuses[group]==='confirmed'&&albumUrl(saved||'')){
   const direct=document.createElement('a');direct.className='listen';direct.href=saved;direct.target='_blank';direct.rel='noopener noreferrer';direct.textContent='利用者が確認した作品リンク ↗';info.append(direct);
   const caution=document.createElement('div');caution.className='sub';caution.textContent='作品単位の保存リンクです。この発売盤との同一性・配信許諾は未確認です。';info.append(caution);
  }
  article.append(info);section.append(article);
 }
 if(!visible.length)line('この取得範囲に該当するアルバムはありません。情報不足だけで非公式とは判定しません。');
 if(officialOffset<officialTotal||officialError){const more=document.createElement('button');more.className='more';more.textContent=officialError?'発売記録の取得を再試行':'さらに発売記録を読み込む';more.disabled=officialLoading;more.onclick=()=>loadOfficialReleases();section.append(more)}
 results.prepend(section);
}

async function loadMore(){if(busy)return;busy=true;status.textContent='作品を読み込んでいます…';try{let data=await api('release-group?artist='+encodeURIComponent(artistId)+'&type=album&limit=100&offset='+offset+'&fmt=json');let batch=data['release-groups']||[];let seen=new Set(albums.map(a=>a.id));for(let a of batch){if(!seen.has(a.id)){albums.push(a);seen.add(a.id)}}offset+=batch.length;total=data['release-group-count']||0;status.textContent='従来の参考一覧：'+uniqueAlbums().length+'作品を表示しています（取得済み'+albums.length+'件）。';render()}catch(e){status.textContent=e.message+'。少し時間をおいて再試行してください。';if(ytAlbums.length)render()}finally{busy=false}}
async function showRelatedBands(){
  let existing=$('related-bands');if(existing)existing.remove();
  if(!artistId)return;
  const currentId=artistId;
  let section=document.createElement('section');section.id='related-bands';
  let heading=document.createElement('h2');heading.className='artist';heading.textContent='関連するバンド名義';
  let description=document.createElement('p');description.className='sub';description.textContent='MusicBrainzに登録された所属バンドを表示します。作品は混ぜず、名義ごとに探せます。';
  let trigger=document.createElement('button');trigger.className='detail-btn';trigger.textContent='所属バンドを調べる →';
  trigger.onclick=async()=>{
    trigger.disabled=true;trigger.textContent='確認中…';
    try{
      let data=await api('artist/'+encodeURIComponent(currentId)+'?inc=artist-rels&fmt=json');
      if(artistId!==currentId)return;
      let bands=new Map();
      for(const rel of data.relations||[]){
        if(rel.type!=='member of band'||!rel.artist||rel.artist.id===currentId)continue;
        if(rel.artist.type&&rel.artist.type!=='Group')continue;
        bands.set(rel.artist.id,rel.artist);
      }
      trigger.remove();
      if(!bands.size){let p=document.createElement('p');p.className='sub';p.textContent='登録された所属バンドは見つかりませんでした。';section.append(p);return}
      for(const band of bands.values()){
        let row=document.createElement('article');row.className='album';
        let info=document.createElement('div');info.className='info';
        let name=document.createElement('div');name.className='album-title';name.textContent=band.name;
        let button=document.createElement('button');button.className='detail-btn';button.textContent='この名義の作品を見る →';button.onclick=()=>chooseArtist(band);
        info.append(name,button);row.append(info);section.append(row);
      }
    }catch(e){trigger.disabled=false;trigger.textContent='再試行する →';description.textContent='関連名義を取得できませんでした。'}
  };
  section.append(heading,description,trigger);results.append(section);
}
async function chooseArtist(artist){
  artistChoices=[];albums=[];ytAlbums=[];relatedCatalogAlbums=[];ytVisible=20;ytSort='name';offset=0;total=0;filter='おすすめ';
  artistId=artist.id;artistName=artist.name;results.innerHTML='';
  status.textContent='「'+artistName+'」のアルバムを取得します…';
  const officialTask=loadOfficialReleases(true);
  try{
    let response=await fetch('data/ytmusic-albums.json?cache='+Date.now());
    if(response.ok){
      let catalog=await response.json();
      ytAlbums=catalog[artistName]||[];
      // When viewing a band's discography, also look for matching album links
      // catalogued under its recorded members' solo names.
      if(artist.type==='Group'){
        try{
          let relations=await api('artist/'+encodeURIComponent(artist.id)+'?inc=artist-rels&fmt=json');
          let memberNames=new Set();
          for(const rel of relations.relations||[]){
            if(rel.type!=='member of band'||!rel.artist)continue;
            memberNames.add(normalize(rel.artist.name));
          }
          for(const [name,entries] of Object.entries(catalog)){
            if(memberNames.has(normalize(name)))relatedCatalogAlbums.push(...entries);
          }
        }catch(e){console.warn('Related catalog unavailable',e)}
      }
    }
  }catch(error){console.warn('Catalog not available yet',error)}
  await officialTask;
  await loadMore();
  if(artistId===artist.id)showRelatedBands();
  // Fill unknown years using the selected artist and their linked bands.
  // Never infer a year from an unrelated artist with the same album title.
  const missing=[]; // Historical catalog enrichment is now an optional tool.
  let changed=false;
  let bandGroups=[];
  let relatedArtistIds=new Set([artist.id]);
  let relatedArtistNames=new Set([normalize(artistName)]);
  if(missing.length&&artist.type!=='Group'){
    try{
      const relationData=await api('artist/'+encodeURIComponent(artist.id)+'?inc=artist-rels&fmt=json');
      const bands=[...new Map((relationData.relations||[])
        .filter(rel=>rel.type==='member of band'&&rel.artist&&rel.artist.id!==artist.id)
        .map(rel=>[rel.artist.id,rel.artist])).values()].slice(0,8);
      for(const band of bands){
        relatedArtistIds.add(band.id);
        relatedArtistNames.add(normalize(band.name));
        if(artistId!==artist.id)break;
        try{
          const d=await api('release-group?artist='+encodeURIComponent(band.id)+'&type=album&limit=100&fmt=json');
          bandGroups.push(...(d['release-groups']||[]));
        }catch(e){console.warn('Band discography lookup skipped',band.name,e)}
      }
    }catch(e){console.warn('Related band year lookup unavailable',e)}
  }
  for(const a of missing){
    if(artistId!==artist.id)break;
    try{
      let found=[...albums,...bandGroups].filter(x=>
        titleKey(x.title)===titleKey(a.title)&&/^\d{4}/.test(x['first-release-date']||'')
      ).sort((x,y)=>(x['first-release-date']||'').localeCompare(y['first-release-date']||''))[0];
      if(!found){
        // Title-only search also finds releases credited to related groups;
        // accept only an exact title and an artist-credit matching this artist or a linked band.
        let query='releasegroup:"'+a.title.replace(/"/g,'')+'"';
        let data=await api('release-group?query='+encodeURIComponent(query)+'&limit=25&fmt=json');
        found=(data['release-groups']||[]).filter(x=>
          titleKey(x.title)===titleKey(a.title)&&/^\d{4}/.test(x['first-release-date']||'')&&
          (x['artist-credit']||[]).some(ac=>ac.artist&&
            (relatedArtistIds.has(ac.artist.id)||relatedArtistNames.has(normalize(ac.artist.name))))
        ).sort((x,y)=>(x['first-release-date']||'').localeCompare(y['first-release-date']||''))[0];
      }
      if(found){
        a.original_year=found['first-release-date'].slice(0,4);
        a.mb_release_group=found.id;
        a.albumType=typeOf(found);
        if(!albums.some(x=>x.id===found.id))albums.push(found);
        changed=true;
      }
    }catch(e){console.warn('Year lookup skipped',a.title,e.message);break}
  }
  if(changed&&artistId===artist.id){render();showRelatedBands();}
}
function showArtistChoices(list){
  results.innerHTML='';let section=document.createElement('section');
  let heading=document.createElement('h2');heading.className='artist';heading.textContent='アーティストを選択';
  let note=document.createElement('p');note.className='sub';note.textContent='同じ人物のソロ名義とバンド名義が別々に表示される場合があります。';
  section.append(heading,note);
  for(const a of list){let row=document.createElement('article');row.className='album';let info=document.createElement('div');info.className='info';
    let name=document.createElement('div');name.className='album-title';name.textContent=a.name;
    let description=document.createElement('div');description.className='meta';description.textContent=(a.disambiguation||'')+(a.type?' · '+a.type:'');
    let button=document.createElement('button');button.className='detail-btn';button.textContent='この名義の作品を見る →';button.onclick=()=>chooseArtist(a);
    info.append(name,description,button);row.append(info);section.append(row)}
  results.append(section);status.textContent=list.length+'件の候補が見つかりました。アーティストを選択してください。';
}
$('form').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;let raw=$('query').value.trim();let q=aliases[normalize(raw)]||raw;
  albums=[];ytAlbums=[];artistName='';artistId='';results.innerHTML='';status.textContent='アーティストを探しています…';
  busy=true;$('submit').disabled=true;
  try{
    let terms=[q];if(normalize(q)==='jimihendrix')terms.push('The Jimi Hendrix Experience');
    let lists=await Promise.all(terms.map(term=>api('artist?query='+encodeURIComponent(term)+'&limit=15&fmt=json')));
    let candidates=new Map();
    for(const data of lists){for(const a of data.artists||[]){if(!candidates.has(a.id))candidates.set(a.id,a)}}
    let list=[...candidates.values()];
    if(!list.length){status.textContent='見つかりませんでした。英語表記でもお試しください。';return}
    const queryKey=normalize(q);
    list.sort((a,b)=>{let score=x=>normalize(x.name)===queryKey?0:normalize(x.name).includes(queryKey)||queryKey.includes(normalize(x.name))?1:2;return score(a)-score(b)});
    showArtistChoices(list.slice(0,12));
  }catch(err){status.textContent=err.message}
  finally{busy=false;$('submit').disabled=false}
});
