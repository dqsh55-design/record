<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RECORD — Find the music.</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#252525;background:#f8f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:65px 22px 90px}header{text-align:center;margin-bottom:54px}h1{font-size:39px;letter-spacing:.22em;font-weight:450;margin:0 0 12px;padding-left:.22em}header p{color:#888;font-size:12px;letter-spacing:.13em;margin:0}.intro{font-size:14px;color:#777;line-height:1.9;text-align:center;margin-bottom:28px}.search{display:flex;gap:8px}input{min-width:0;flex:1;padding:16px;border:1px solid #d9d7d2;border-radius:4px;background:white;font-size:16px}button{border:0;background:#242424;color:#fff;padding:0 24px;border-radius:4px;font-size:15px;cursor:pointer}button:disabled{opacity:.5}.hint{font-size:12px;color:#999;margin-top:12px}.status{margin:32px 0;color:#777;font-size:14px;line-height:1.8}.artist{font-size:24px;font-weight:500;margin:42px 0 8px}.sub{font-size:12px;color:#888;margin-bottom:22px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.filter{background:transparent;color:#666;border:1px solid #d8d6d1;border-radius:30px;padding:9px 14px;font-size:12px}.filter.active{background:#252525;color:white;border-color:#252525}.album{border-top:1px solid #e0ded9;padding:18px 0;display:flex;gap:17px;align-items:center}.cover{width:76px;height:76px;flex:none;background:#e9e7e2;border-radius:2px;object-fit:cover}.info{min-width:0;flex:1}.album-title{font-size:15px;font-weight:550;line-height:1.5}.meta{font-size:12px;color:#888;margin:6px 0 10px}.listen{font-size:12px;color:#4d4d4d;text-underline-offset:3px}.detail-btn{background:transparent;color:#555;border:1px solid #d8d6d1;padding:7px 10px;font-size:12px;margin-top:9px}.direct-url{display:block;width:100%;max-width:390px;margin-top:8px;padding:9px;border:1px solid #d8d6d1;border-radius:4px;background:#fff;font-size:12px}.release-detail{font-size:12px;color:#777;line-height:1.8;margin-top:8px}.note{font-size:12px;line-height:1.8;color:#999;margin-top:36px}.more{display:block;margin:26px auto 0;padding:13px 24px}footer{text-align:center;color:#aaa;font-size:11px;margin-top:80px}@media(max-width:420px){main{padding-top:48px}h1{font-size:33px}.search button{padding:0 17px}.cover{width:66px;height:66px}}
</style></head><body><main><header><h1>RECORD</h1><p>FIND THE MUSIC. KNOW THE ERA.</p></header><div class="intro">アーティストから、音楽の歴史をたどる。<br>正規発売アルバムを探すための音楽ガイド。</div><form class="search" id="form"><input id="query" aria-label="アーティスト名" placeholder="例：マイルス・デイヴィス" autocomplete="off" required><button id="submit">検索</button></form><div class="hint">日本語・英語で検索できます</div><div id="status" class="status">アーティスト名を入力して検索してください。</div><section id="results" aria-live="polite"></section><footer>RECORD · Music data by MusicBrainz</footer></main>
<script>
const $=id=>document.getElementById(id), status=$('status'),results=$('results');
let albums=[],filter='すべて',artistName='',offset=0,artistId='',busy=false,total=0;
const aliases={'マイルスデイビス':'Miles Davis','マイルスデイヴィス':'Miles Davis','デュークエリントン':'Duke Ellington','ジェフベック':'Jeff Beck','ジミヘンドリックス':'Jimi Hendrix','ジミヘン':'Jimi Hendrix','スタンゲッツ':'Stan Getz','ジョンコルトレーン':'John Coltrane','チックコリア':'Chick Corea','ビートルズ':'The Beatles','原田知世':'Tomoyo Harada'};
const normalize=s=>s.toLowerCase().replace(/[\s・･ー‐－]/g,'');
function typeOf(a){let t=a['secondary-types']||[];if(t.includes('Compilation'))return 'ベスト・編集盤';if(t.includes('Live'))return 'ライブ盤';if(a['primary-type']==='Album')return 'スタジオ盤';return 'その他'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path){let r=await fetch('https://musicbrainz.org/ws/2/'+path,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('音楽データを取得できませんでした（'+r.status+'）');return r.json()}
function titleKey(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/\([^)]*(remaster|mono|stereo|edition)[^)]*\)/gi,'').replace(/[^\p{L}\p{N}]/gu,'')}
function uniqueAlbums(){let map=new Map();for(const a of albums){const key=titleKey(a.title)+'|'+typeOf(a);if(!map.has(key))map.set(key,a);else{const old=map.get(key);if((a['first-release-date']||'9999')<(old['first-release-date']||'9999'))map.set(key,a)}}return [...map.values()].sort((a,b)=>(a['first-release-date']||'9999').localeCompare(b['first-release-date']||'9999'))}
async function showReleaseDetail(a,container,btn){btn.disabled=true;btn.textContent='発売元を確認中…';try{let d=await api('release?release-group='+encodeURIComponent(a.id)+'&inc=labels&limit=100&fmt=json');let releases=d.releases||[];let labels=[];for(const r of releases){for(const li of r['label-info']||[]){if(li.label?.name&&!labels.includes(li.label.name))labels.push(li.label.name)}}container.textContent=labels.length?'登録されている発売元：'+labels.slice(0,8).join(' / ')+(labels.length>8?' ほか':''):'確認した発売盤には発売元の登録が見つかりませんでした。';if(d['release-count']>100)container.textContent+='（最初の100件を確認）';btn.textContent='発売元を確認済み'}catch(e){container.textContent='発売元を取得できませんでした。時間をおいてお試しください。';btn.disabled=false;btn.textContent='もう一度確認する'}}
const verifiedLinks=(()=>{try{return JSON.parse(localStorage.getItem('recordVerifiedLinks')||'{}')}catch{return {}}})();
function isAlbumUrl(s){try{let u=new URL(s);return u.protocol==='https:'&&u.hostname==='music.youtube.com'&&u.pathname==='/playlist'&&u.searchParams.has('list')||u.protocol==='https:'&&u.hostname==='music.youtube.com'&&u.pathname==='/browse'&&u.pathname.length>0}catch{return false}}
function saveAlbumUrl(id,url){verifiedLinks[id]=url;try{localStorage.setItem('recordVerifiedLinks',JSON.stringify(verifiedLinks));return true}catch{return false}}
function render(){results.innerHTML='';if(!artistName)return;let h=document.createElement('h2');h.className='artist';h.textContent=artistName;results.append(h);let sub=document.createElement('div');sub.className='sub';sub.textContent='MusicBrainzに登録された作品情報 · 同名作品を整理して表示';results.append(sub);let filters=document.createElement('div');filters.className='filters';for(let f of ['すべて','スタジオ盤','ライブ盤','ベスト・編集盤','その他']){let b=document.createElement('button');b.className='filter'+(filter===f?' active':'');b.textContent=f;b.onclick=()=>{filter=f;render()};filters.append(b)}results.append(filters);let shown=uniqueAlbums().filter(a=>filter==='すべて'||typeOf(a)===filter);for(let a of shown){let item=document.createElement('article');item.className='album';let img=document.createElement('img');img.className='cover';img.alt='';img.loading='lazy';img.src='https://coverartarchive.org/release-group/'+encodeURIComponent(a.id)+'/front-250';img.onerror=()=>{img.onerror=null;img.removeAttribute('src')};let info=document.createElement('div');info.className='info';let title=document.createElement('div');title.className='album-title';title.textContent=a.title;let meta=document.createElement('div');meta.className='meta';meta.textContent=(a['first-release-date']?.slice(0,4)||'発売年不明')+' · '+typeOf(a);let link=document.createElement('a');link.className='listen';link.target='_blank';link.rel='noopener noreferrer';const searchUrl='https://music.youtube.com/search?q='+encodeURIComponent(artistName+' '+a.title);let saved=verifiedLinks[a.id];link.href=saved&&isAlbumUrl(saved)?saved:searchUrl;link.textContent=saved&&isAlbumUrl(saved)?'登録したアルバムを直接開く ↗':'YouTube Musicで探す ↗';let direct=document.createElement('button');direct.className='detail-btn';direct.textContent=saved?'直接リンクを変更':'正しいアルバムのURLを登録';direct.onclick=()=>{let existing=document.getElementById('url-'+a.id);if(existing){existing.remove();return}let input=document.createElement('input');input.id='url-'+a.id;input.className='direct-url';input.placeholder='YouTube MusicのアルバムURLを貼り付け';input.value=verifiedLinks[a.id]||'';let save=document.createElement('button');save.className='detail-btn';save.textContent='保存';let cancel=document.createElement('button');cancel.className='detail-btn';cancel.textContent='取消';let wrap=document.createElement('div');wrap.id='url-'+a.id;wrap.append(input,save,cancel);save.onclick=()=>{let value=input.value.trim();if(!isAlbumUrl(value)){alert('YouTube MusicのアルバムURLを入力してください。');return}if(!saveAlbumUrl(a.id,value)){alert('保存できませんでした。ブラウザの保存設定をご確認ください。');return}render()};cancel.onclick=()=>wrap.remove();direct.after(wrap)};let detail=document.createElement('div');detail.className='release-detail';let btn=document.createElement('button');btn.className='detail-btn';btn.textContent='発売元を確認';btn.onclick=()=>showReleaseDetail(a,detail,btn);info.append(title,meta,link,document.createElement('br'),btn,detail,document.createElement('br'),direct);item.append(img,info);results.append(item)}if(!shown.length){let p=document.createElement('div');p.className='status';p.textContent='この分類の作品は、取得済みのデータにはありません。';results.append(p)}let note=document.createElement('p');note.className='note';note.textContent='※ 登録した直接リンクはこのブラウザ内に保存され、他の端末には同期されません。アルバムURLはご自身で確認してください。同名作品の整理は簡易的なものです。発売元の表示はMusicBrainzの登録情報であり、正規盤・音質・YouTube Musicの配信状況を保証しません。検索先で配信元もご確認ください。';results.append(note);if(offset<total){let more=document.createElement('button');more.className='more';more.textContent='さらに作品を読み込む';more.disabled=busy;more.onclick=loadMore;results.append(more)}}
async function loadMore(){if(busy)return;busy=true;status.textContent='作品を読み込んでいます…';try{let data=await api('release-group?artist='+encodeURIComponent(artistId)+'&type=album&limit=100&offset='+offset+'&fmt=json');let batch=data['release-groups']||[];let seen=new Set(albums.map(a=>a.id));for(let a of batch){if(!seen.has(a.id)){albums.push(a);seen.add(a.id)}}offset+=batch.length;total=data['release-group-count']||0;status.textContent=uniqueAlbums().length+'作品を表示しています（取得済み'+albums.length+'件）。';render()}catch(e){status.textContent=e.message+'。少し時間をおいて再試行してください。'}finally{busy=false}}
$('form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;let raw=$('query').value.trim();let q=aliases[normalize(raw)]||raw;albums=[];offset=0;total=0;artistName='';artistId='';filter='すべて';results.innerHTML='';status.textContent='アーティストを探しています…';busy=true;$('submit').disabled=true;try{let data=await api('artist?query='+encodeURIComponent(q)+'&limit=10&fmt=json');let list=data.artists||[];if(!list.length){status.textContent='見つかりませんでした。英語表記でもお試しください。';return}let exact=list.find(a=>normalize(a.name)===normalize(q)||a.aliases?.some(x=>normalize(x.name)===normalize(q)));let artist=exact||list[0];artistId=artist.id;artistName=artist.name;status.textContent='「'+artistName+'」のアルバムを取得します…'}catch(err){status.textContent=err.message;return}finally{busy=false;$('submit').disabled=false}await loadMore()});
</script></body></html>
