function automaticState(a){

 const age=Date.now()-Date.parse(e.checked_at);
 if(!Number.isFinite(age)||age<0||age>30*24*60*60*1000)return 'insufficient';

function appendAutomaticEvidence(a,info){

function titleKey(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/\([^)]*(remaster|mono|stereo|edition)[^)]*\)/gi,'').replace(/[^\p{L}\p{N}]/gu,'')}
function uniqueAlbums(){let map=new Map();for(const a of albums){const key=titleKey(a.title)+'|'+typeOf(a);if(!map.has(key))map.set(key,a);else{const old=map.get(key);if((a['first-release-date']||'9999')<(old['first-release-date']||'9999'))map.set(key,a)}}return [...map.values()].sort((a,b)=>(a['first-release-date']||'9999').localeCompare(b['first-release-date']||'9999'))}
const releaseEvidenceCache=(()=>{try{return JSON.parse(localStorage.getItem('recordReleaseEvidenceV1')||'{}')}catch{return {}}})();
function usableLabel(name){return typeof name==='string'&&name.trim()&&!['[no label]','[unknown]'].includes(name.trim().toLowerCase())}
function cachedOfficialEvidence(id){
  const record=releaseEvidenceCache[id];
  if(!record||Date.now()-record.savedAt>=30*24*60*60*1000)return null;
  const releases=record.data?.releases||[];
  return releases.some(r=>(r.status||'').toLowerCase()==='official'&&(r['label-info']||[]).some(li=>usableLabel(li.label?.name)))?'official':'unconfirmed';
}

async function showReleaseDetail(a,container,btn){

    }

      labels:[...new Set((r['label-info']||[]).map(li=>li.label?.name).filter(usableLabel))]

const verifiedLinks=(()=>{try{return JSON.parse(localStorage.getItem('recordVerifiedLinks')||'{}')}catch{return {}}})();

function renderSearchSources(data){
 const panel=document.createElement('details');panel.id='search-sources';
 const caption=document.createElement('summary');caption.textContent='公式情報の確認状況';panel.append(caption);
 const labels={ok:'取得済み',unconfirmed:'発売根拠が不足',blocked:'アクセス制限',not_found:'ページなし',fetch_error:'取得失敗',unsupported_format:'形式未対応',unsafe_source:'情報源を検証できず',unsafe_redirect:'転送先を検証できず',response_too_large:'取得上限',unsupported_encoding:'形式未対応',budget_exhausted:'本日の公式サイト取得上限'};
 for(const source of data.sources||[]){
  const line=document.createElement('p');line.className='release-detail';line.textContent=(labels[source.status]||'確認できず')+(/^\d{3}$/.test(source.code||'')?'（'+source.code+'）':'')+'：';
  try{const u=new URL(source.url);if(u.protocol==='https:'&&!u.username&&!u.password&&!u.port&&officialSourceHosts.has(u.hostname)){const link=document.createElement('a');link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent=u.hostname+u.pathname;line.append(link)}}catch{}
  panel.append(line);
 }
 const coverage=document.createElement('p');coverage.className='release-detail';coverage.textContent='確認できた公式資料の範囲です。全作品の網羅や公式サイトの不存在を断定するものではありません。';panel.append(coverage);
 const refresh=document.createElement('button');refresh.className='detail-btn';refresh.textContent='公式情報を再確認';refresh.onclick=()=>searchOfficialNow(liveQuery,true);
 results.append(panel,refresh);
}
async function searchOfficialNow(raw,refresh=false){
 raw=raw.trim();if(!raw)return;
 const token=++liveSearchToken;liveSearchController?.abort();
 const controller=new AbortController();liveSearchController=controller;
 const timer=setTimeout(()=>controller.abort(),180000);
 const warming=setTimeout(()=>{if(token===liveSearchToken)status.textContent='検索サービスの起動、または公式情報の確認に時間がかかっています。そのままお待ちください…'},15000);
 liveQuery=raw;busy=true;$('submit').disabled=true;results.replaceChildren();status.textContent='公式ディスコグラフィーを検索し、正式発売の根拠を確認しています…';
 try{
  const configured=document.querySelector('meta[name="record-api-base"]')?.content;
  const endpoint=new URL('api/search',configured||document.baseURI);endpoint.searchParams.set('q',raw);if(refresh)endpoint.searchParams.set('refresh','1');
  const response=await fetch(endpoint,{signal:controller.signal,headers:{Accept:'application/json'},cache:'no-store'});
  if(token!==liveSearchToken)return;
  if(response.status===400){status.dataset.state='invalid_query';status.textContent='アーティスト名を120文字以内で入力してください。';return}
  if(response.status===429){status.dataset.state='rate_limited';status.textContent='検索が集中しています。1分ほど待って再検索してください。';return}
  if(!response.ok)throw Error('search service unavailable');
  const data=await response.json();if(token!==liveSearchToken)return;
  if(data.version!==1||typeof data.artist?.id!=='string'||typeof data.artist?.name!=='string'||!Array.isArray(data.artist?.albums)||!Array.isArray(data.sources)||data.artist.albums.length>500)throw Error('invalid search response');
  const verified=data.artist.albums.filter(album=>liveAlbumValid(album,data.artist));
  if(verified.length!==data.artist.albums.length&&!verified.length)data.status='unconfirmed';
  data.artist={...data.artist,albums:verified};liveSearchResult=data;
  officialCatalog={version:1,artists:[data.artist]};artistName=data.artist.name;artistId=data.artist.id;
  renderOfficialCatalog();status.textContent=officialResultMessage(data,verified.length);status.dataset.state=data.status;
  const empty=results.querySelector('#official-catalog .status');if(empty)empty.textContent=officialResultMessage(data,0);
  renderSearchSources(data);
 }catch(error){
  if(token!==liveSearchToken)return;
  results.replaceChildren();status.dataset.state='service_unavailable';status.textContent=error.name==='AbortError'?'公式検索の通信がタイムアウトしました。再検索してください。':'公式検索サービスに接続できませんでした。時間をおいて再検索してください。';
 }finally{clearTimeout(timer);clearTimeout(warming);if(token===liveSearchToken){busy=false;$('submit').disabled=false}}
}
$('form').addEventListener('submit',e=>{e.preventDefault();searchOfficialNow($('query').value)});
</script></body></html>
