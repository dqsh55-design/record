name: Build YouTube Music catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: catalog-updates
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'ytmusicapi>=1.10,<2'
      - if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * 1'
        run: python scripts/build_catalog.py
      # Feed the same catalog that chooseArtist() reads; never publish an artifact-only result.
      - run: python scripts/verify_catalog.py --limit 12
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ytmusic-albums.json data/bridge-diagnostics.json
          git diff --cached --quiet || (git commit -m "Refresh YouTube Music catalog" && git push)
