name: Build YouTube Music catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'ytmusicapi>=1.10,<2'
      - run: python scripts/build_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ytmusic-albums.json
          git diff --cached --quiet || (git commit -m "Refresh YouTube Music catalog" && git push)
