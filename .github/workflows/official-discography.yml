name: Legacy offline catalog preview (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/generate_official_catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-official-preview
          path: reports/*.json
