name: Check automatic release evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'ytmusicapi>=1.10,<2'
      - run: python scripts/verify_catalog.py --limit 12
      - uses: actions/upload-artifact@v4
        with:
          name: verified-catalog
          path: data/ytmusic-albums.json
