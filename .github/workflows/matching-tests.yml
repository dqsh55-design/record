name: Release matching tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*matching.py' -v
      - run: python -m unittest discover -s tests -p 'test_official_discography.py' -v
      - run: python -m unittest discover -s tests -p 'test_columbia_catalog.py' -v
      - run: python -m unittest discover -s tests -p 'test_official_generator.py' -v
      - run: python -m unittest discover -s tests -p 'test_realtime_search.py' -v
      - run: node tests/test_official_catalog.cjs
      - run: node tests/test_loading.cjs
      - run: node tests/test_api_cache.cjs
      - run: node tests/test_browser.cjs
      - run: node tests/test_credit_attribution.cjs
      - run: node tests/test_chronology.cjs
      - run: node tests/test_album_classification.cjs
      - run: pip install 'playwright>=1.50,<2' -r server/requirements.txt
      - run: gunicorn 'server.app:create_app()' --check-config
      # ubuntu-latest includes Chrome and its native libraries.
      - run: google-chrome --version
      - run: python tests/test_official_ui.py
      - run: python -m py_compile scripts/build_catalog.py scripts/release_matching.py scripts/automatic_matching.py scripts/verify_catalog.py

