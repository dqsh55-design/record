name: RECORD Pages checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_*matching.py' -v
      - run: python -m unittest discover -s tests -p 'test_official_discography.py' -v
      - run: python -m unittest discover -s tests -p 'test_columbia_catalog.py' -v
      - run: python -m unittest discover -s tests -p 'test_catalog_additions.py' -v
      - run: python -m unittest discover -s tests -p 'test_miles_discography.py' -v
      - run: python -m unittest discover -s tests -p 'test_catalog_hundred.py' -v
      - run: python -m unittest discover -s tests -p 'test_artist_expansion.py' -v
      - run: python -m unittest discover -s tests -p 'test_deeper_discographies.py' -v
      - run: python -m unittest discover -s tests -p 'test_wider_artists.py' -v
      - run: python -m unittest discover -s tests -p 'test_official_probe.py' -v
      - run: python -m unittest discover -s tests -p 'test_on_demand_prototype.py' -v
      - run: python -m unittest discover -s tests -p 'test_official_generator.py' -v
      - run: python -m unittest discover -s tests -p 'test_realtime_search.py' -v
      - run: python -m unittest discover -s tests -p 'test_public_hosting.py' -v
      - run: python -m unittest discover -s tests -p 'test_render_readiness.py' -v
      - run: node tests/test_official_catalog.cjs
      - run: node tests/test_loading.cjs
      - run: node tests/test_api_cache.cjs
      - run: node tests/test_browser.cjs
      - run: node tests/test_credit_attribution.cjs
      - run: node tests/test_chronology.cjs
      - run: node tests/test_album_classification.cjs
      - run: pip install 'playwright>=1.50,<2' -r server/requirements-free.txt
      - run: python scripts/check_free_runtime.py
      - run: python scripts/validate_v090_readiness.py --output /tmp/record-v090-readiness.json
      - run: google-chrome --version
      - run: python tests/test_pages_ui.py
      # The preserved future API is opt-in in its browser tests; no account needed.
      - run: python tests/test_official_ui.py
      - run: python tests/test_hybrid_ui.py
      - run: python -m py_compile scripts/build_catalog.py scripts/release_matching.py scripts/automatic_matching.py scripts/verify_catalog.py
